services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartx
      POSTGRES_USER: smartx
      POSTGRES_PASSWORD: smartx_dev
    ports:
      - "5432:5432"
    volumes:
      - smartx-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartx -d smartx"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=smartx;Username=smartx;Password=smartx_dev"
      ClientOrigin: "http://localhost:8081"
      ASPNETCORE_ENVIRONMENT: "Development"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  client:
    build:
      context: .
      dockerfile: SmartX.Client/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  smartx-data: